<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Askee — Ask away</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --background: #f7f5ff;

      --text: #17152b;
      --muted: #747084;
      --light-muted: #9a96a9;

      --purple: #6d4aff;
      --purple-dark: #5738e6;

      --pink: #ff62ad;
      --yellow: #ffd75c;

      --green: #43b889;

      --white: rgba(255, 255, 255, 0.72);
      --white-solid: #ffffff;

      --border: rgba(35, 27, 75, 0.08);

      --shadow:
        0 25px 70px rgba(73, 50, 150, 0.15);
    }


    /* ========================================
       RESET
    ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ========================================
       BODY
    ======================================== */

    body {

      min-height: 100vh;

      overflow-x: hidden;

      font-family: "DM Sans", sans-serif;

      color: var(--text);

      background:

        radial-gradient(
          circle at 12% 8%,
          rgba(255, 174, 216, 0.48),
          transparent 28rem
        ),

        radial-gradient(
          circle at 90% 10%,
          rgba(177, 160, 255, 0.48),
          transparent 30rem
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(255, 220, 120, 0.25),
          transparent 34rem
        ),

        var(--background);

    }


    /* ========================================
       BACKGROUND GRID
    ======================================== */

    body::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: 0.22;

      background-image:

        linear-gradient(
          rgba(255,255,255,0.5) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,0.5) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 75%
        );

    }


    /* ========================================
       PAGE
    ======================================== */

    .page {

      width:
        min(
          1120px,
          calc(100% - 40px)
        );

      min-height: 100vh;

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      position: relative;

    }


    /* ========================================
       NAV
    ======================================== */

    nav {

      height: 88px;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .logo {

      display: flex;

      align-items: center;

      gap: 10px;

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-size: 1.35rem;

      font-weight: 800;

      letter-spacing: -0.06em;

    }


    .logo-mark {

      width: 36px;
      height: 36px;

      display: grid;

      place-items: center;

      color: white;

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-size: 16px;

      font-weight: 800;

      border-radius:
        12px
        12px
        12px
        4px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          #9b70ff
        );

      box-shadow:
        0 9px 23px
        rgba(109, 74, 255, 0.28);

    }


    .stage-badge {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        8px
        12px;

      border:
        1px solid
        var(--border);

      border-radius: 999px;

      color: #716c82;

      background:
        rgba(255,255,255,0.56);

      font-size: 0.75rem;

      font-weight: 700;

    }


    .stage-dot {

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--pink);

      box-shadow:
        0 0 0 4px
        rgba(255,98,173,0.11);

    }


    /* ========================================
       MAIN
    ======================================== */

    main {

      flex: 1;

      display: flex;

      justify-content: center;

      padding:
        34px
        0
        65px;

    }


    .content {

      width: 100%;

      max-width: 700px;

      position: relative;

    }


    /* ========================================
       HEADING
    ======================================== */

    .heading {

      text-align: center;

      margin-bottom: 26px;

    }


    h1 {

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-size:
        clamp(
          2.7rem,
          5.5vw,
          4.35rem
        );

      line-height: 1;

      letter-spacing: -0.075em;

    }


    h1 .accent {

      position: relative;

      color: var(--purple);

    }


    h1 .accent::after {

      content: "";

      position: absolute;

      left: 3%;

      right: -2%;

      bottom: -7px;

      height: 9px;

      border-radius: 50%;

      background:
        var(--yellow);

      transform:
        rotate(-2deg);

      z-index: -1;

    }


    .heading-text {

      margin-top: 15px;

      color: var(--muted);

      font-size: 0.94rem;

    }


    /* ========================================
       GAME STATUS
    ======================================== */

    .status {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 12px;

      margin-bottom: 20px;

    }


    .status-card {

      padding:
        17px
        20px;

      border:
        1px solid
        rgba(255,255,255,0.9);

      border-radius: 18px;

      background:
        var(--white);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 13px 35px
        rgba(73,50,150,0.08);

      text-align: center;

    }


    .status-label {

      color: #9893a6;

      font-size: 0.66rem;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.09em;

    }


    .status-value {

      margin-top: 4px;

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-size: 1.5rem;

      font-weight: 800;

      letter-spacing: -0.05em;

    }


    .timer-value {

      color: var(--purple);

    }


    .timer-value.warning {

      color: var(--pink);

    }


    /* ========================================
       PROGRESS
    ======================================== */

    .progress {

      height: 7px;

      margin:
        0
        2px
        22px;

      overflow: hidden;

      border-radius: 999px;

      background:
        rgba(109,74,255,0.09);

    }


    .progress-bar {

      width: 6%;

      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--purple),
          #9b70ff
        );

      transition:
        width .4s ease;

    }


    /* ========================================
       COMPOSER CARD
    ======================================== */

    .composer {

      position: relative;

      padding: 25px;

      border:
        1px solid
        rgba(255,255,255,0.9);

      border-radius: 25px;

      background:
        var(--white);

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        var(--shadow);

    }


    .field-label {

      margin-bottom: 11px;

      color: #686278;

      font-size: 0.72rem;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.08em;

    }


    /* ========================================
       QUESTION TYPES
    ======================================== */

    .type-options {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 11px;

      margin-bottom: 24px;

    }


    .type-option {

      min-height: 106px;

      padding:
        15px;

      border:
        1px solid
        rgba(35,27,75,0.08);

      border-radius: 16px;

      background:
        rgba(255,255,255,0.5);

      color: #716c80;

      text-align: left;

      cursor: pointer;

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;

    }


    .type-option:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.82);

    }


    .type-option.selected {

      border-color:
        rgba(109,74,255,0.32);

      background:
        rgba(109,74,255,0.075);

      box-shadow:
        inset 0 0 0 1px
        rgba(109,74,255,0.08);

    }


    .type-icon {

      width: 31px;
      height: 31px;

      display: grid;

      place-items: center;

      margin-bottom: 9px;

      border-radius: 10px;

      color: var(--purple);

      background:
        rgba(109,74,255,0.09);

      font-size: 13px;

      font-weight: 800;

    }


    .type-option.selected
    .type-icon {

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          #8c69ff
        );

    }


    .type-name {

      color: var(--text);

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-size: 0.84rem;

      font-weight: 800;

      letter-spacing: -0.025em;

    }


    .type-description {

      margin-top: 4px;

      color: #8b8799;

      font-size: 0.7rem;

      line-height: 1.4;

    }


    /* ========================================
       QUESTION INPUT
    ======================================== */

    .question-wrapper {

      position: relative;

    }


    textarea {

      width: 100%;

      min-height: 155px;

      display: block;

      resize: vertical;

      padding:
        16px;

      border:
        1px solid
        rgba(35,27,75,0.09);

      border-radius: 16px;

      outline: none;

      color: var(--text);

      background:
        rgba(255,255,255,0.62);

      font-family:
        "DM Sans",
        sans-serif;

      font-size: 0.98rem;

      line-height: 1.55;

      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;

    }


    textarea::placeholder {

      color:
        #aaa6b5;

    }


    textarea:focus {

      border-color:
        rgba(109,74,255,0.35);

      background:
        rgba(255,255,255,0.86);

      box-shadow:
        0 0 0 4px
        rgba(109,74,255,0.07);

    }


    .character-count {

      position: absolute;

      right: 13px;

      bottom: 11px;

      color: #aaa6b5;

      font-size: 0.68rem;

      font-weight: 600;

    }


    /* ========================================
       SUBMIT
    ======================================== */

    .submit-row {

      margin-top: 17px;

      display: flex;

      justify-content: flex-end;

      align-items: center;

    }


    .submit-button {

      min-height: 48px;

      padding:
        0
        19px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      border: none;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          #805eff
        );

      font-family:
        "DM Sans",
        sans-serif;

      font-size: 0.88rem;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 11px 24px
        rgba(109,74,255,0.23);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        opacity .2s ease;

    }


    .submit-button:hover:not(:disabled) {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 29px
        rgba(109,74,255,0.29);

    }


    .submit-button:disabled {

      opacity: 0.45;

      cursor: not-allowed;

      box-shadow: none;

    }


    .submit-arrow {

      width: 24px;
      height: 24px;

      display: grid;

      place-items: center;

      border-radius: 7px;

      background:
        rgba(255,255,255,0.16);

    }


    /* ========================================
       SENT FEEDBACK
    ======================================== */

    .feedback {

      position: fixed;

      left: 50%;

      bottom: 27px;

      z-index: 20;

      display: flex;

      align-items: center;

      gap: 9px;

      padding:
        11px
        16px;

      border:
        1px solid
        rgba(255,255,255,0.9);

      border-radius: 13px;

      color: #3e725e;

      background:
        rgba(255,255,255,0.9);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        0 15px 40px
        rgba(50,35,100,0.14);

      font-size: 0.82rem;

      font-weight: 700;

      pointer-events: none;

      opacity: 0;

      transform:
        translate(-50%, 15px);

      transition:
        opacity .25s ease,
        transform .25s ease;

    }


    .feedback.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    .feedback-icon {

      width: 23px;
      height: 23px;

      display: grid;

      place-items: center;

      border-radius: 7px;

      color: white;

      background:
        var(--green);

      font-size: 12px;

    }


    /* ========================================
       FOOTER NOTE
    ======================================== */

    .privacy-note {

      margin-top: 17px;

      text-align: center;

      color: #aaa6b6;

      font-size: 0.72rem;

    }


    /* ========================================
       DECORATIVE SPARKS
    ======================================== */

    .spark {

      position: absolute;

      pointer-events: none;

      font-family:
        "Plus Jakarta Sans",
        sans-serif;

      font-weight: 800;

      opacity: .55;

    }


    .spark.one {

      top: -7px;

      left: 3%;

      color: var(--pink);

      font-size: 21px;

      transform: rotate(-14deg);

      animation:
        floatOne 4s
        ease-in-out
        infinite;

    }


    .spark.two {

      top: 25px;

      right: 2%;

      color: var(--purple);

      font-size: 27px;

      transform: rotate(14deg);

      animation:
        floatTwo 5s
        ease-in-out
        infinite;

    }


    /* ========================================
       FOOTER
    ======================================== */

    footer {

      padding:
        18px
        0
        27px;

      display: flex;

      justify-content: center;

      color: #aaa6b6;

      font-size: 0.74rem;

    }


    /* ========================================
       ANIMATIONS
    ======================================== */

    @keyframes floatOne {

      0%, 100% {
        transform:
          translateY(0)
          rotate(-14deg);
      }

      50% {
        transform:
          translateY(-7px)
          rotate(-8deg);
      }

    }


    @keyframes floatTwo {

      0%, 100% {
        transform:
          translateY(0)
          rotate(14deg);
      }

      50% {
        transform:
          translateY(-9px)
          rotate(20deg);
      }

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      .page {

        width:
          calc(100% - 28px);

      }


      nav {

        height: 74px;

      }


      .stage-badge {

        font-size: 0.7rem;

        padding:
          7px
          10px;

      }


      main {

        padding:
          28px
          0
          45px;

      }


      .heading {

        margin-bottom: 21px;

      }


      h1 {

        font-size:
          clamp(
            2.7rem,
            13vw,
            4rem
          );

      }


      .heading-text {

        font-size: 0.87rem;

      }


      .status {

        gap: 9px;

      }


      .status-card {

        padding:
          14px
          10px;

      }


      .status-value {

        font-size: 1.35rem;

      }


      .composer {

        padding:
          19px;

        border-radius:
          21px;

      }


      .type-options {

        gap: 8px;

      }


      .type-option {

        min-height:
          116px;

        padding:
          13px;

      }


      .type-description {

        font-size:
          0.67rem;

      }


      textarea {

        min-height:
          145px;

      }


      .submit-button {

        width: 100%;

      }


      .submit-row {

        display: block;

      }


      .spark.one {

        left: -3px;

      }


      .spark.two {

        right: -2px;

      }

    }


    @media (max-width: 430px) {

      .stage-badge {

        display: none;

      }


      .status-value {

        font-size:
          1.25rem;

      }


      .composer {

        padding:
          16px;

      }


      .type-name {

        font-size:
          0.77rem;

      }


      .type-description {

        font-size:
          0.64rem;

      }

    }


    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>


<body>

  <div class="page">


    <!-- ====================================
         NAVIGATION
    ===================================== -->

    <nav>

      <div class="logo">

        <div class="logo-mark">
          ?
        </div>

        <span>
          askee
        </span>

      </div>


      <div class="stage-badge">

        <span class="stage-dot"></span>

        Asking stage

      </div>

    </nav>



    <!-- ====================================
         MAIN
    ===================================== -->

    <main>

      <section class="content">


        <!-- Decorative elements -->

        <div class="spark one">
          ✦
        </div>

        <div class="spark two">
          ✦
        </div>


        <!-- ====================================
             HEADING
        ===================================== -->

        <div class="heading">

          <h1>

            Ask
            <span class="accent">
              away.
            </span>

          </h1>


          <p class="heading-text">

            Questions are anonymous.
            Make them count.

          </p>

        </div>



        <!-- ====================================
             STATUS
        ===================================== -->

        <div class="status">


          <div class="status-card">

            <div class="status-label">
              Questions asked
            </div>

            <div
              class="status-value"
              id="questionCount"
            >
              3 / 50
            </div>

          </div>


          <div class="status-card">

            <div class="status-label">
              Time left
            </div>

            <div
              class="status-value timer-value"
              id="timer"
            >
              03:45
            </div>

          </div>


        </div>



        <!-- ====================================
             PROGRESS
        ===================================== -->

        <div class="progress">

          <div
            class="progress-bar"
            id="progressBar"
          ></div>

        </div>



        <!-- ====================================
             QUESTION COMPOSER
        ===================================== -->

        <div class="composer">


          <!-- QUESTION TYPE -->

          <div class="field-label">

            What kind of question?

          </div>


          <div class="type-options">


            <button
              type="button"
              class="type-option selected"
              data-type="one"
              onclick="selectType(this)"
            >

              <div class="type-icon">
                1
              </div>


              <div class="type-name">
                One Answer
              </div>


              <div class="type-description">

                Only one player can answer.

              </div>

            </button>



            <button
              type="button"
              class="type-option"
              data-type="everyone"
              onclick="selectType(this)"
            >

              <div class="type-icon">
                ∞
              </div>


              <div class="type-name">
                Everyone
              </div>


              <div class="type-description">

                Everyone can answer.

              </div>

            </button>


          </div>



          <!-- QUESTION -->

          <div class="field-label">

            Your question

          </div>


          <div class="question-wrapper">

            <textarea
              id="questionInput"
              maxlength="300"
              placeholder="Ask anything..."
              oninput="updateCharacterCount()"
            ></textarea>


            <div
              class="character-count"
              id="characterCount"
            >
              0 / 300
            </div>

          </div>



          <!-- SUBMIT -->

          <div class="submit-row">

            <button
              class="submit-button"
              id="submitButton"
              onclick="submitQuestion()"
            >

              Ask Question

              <span class="submit-arrow">
                →
              </span>

            </button>

          </div>


        </div>



        <div class="privacy-note">

          Your question won't reveal who asked it.

        </div>


      </section>

    </main>



    <!-- ====================================
         FOOTER
    ===================================== -->

    <footer>

      Made for questions worth asking.

    </footer>


  </div>



  <!-- ====================================
       QUESTION SENT FEEDBACK
  ===================================== -->

  <div
    class="feedback"
    id="feedback"
  >

    <span class="feedback-icon">
      ✓
    </span>

    Question sent

  </div>



  <script>

    /*
      ========================================
      GAME STATE
      ========================================
    */

    let selectedType = "one";

    let questionCount = 3;

    const questionLimit = 50;

    /*
      Example starting duration:
      3 minutes 45 seconds.
      
      In the real application, this should
      come from the backend / room state.
    */

    let secondsRemaining = 225;


    /*
      ========================================
      SELECT QUESTION TYPE
      ========================================
    */

    function selectType(element) {

      const options =
        document.querySelectorAll(
          ".type-option"
        );


      options.forEach(option => {

        option.classList.remove(
          "selected"
        );

      });


      element.classList.add(
        "selected"
      );


      selectedType =
        element.dataset.type;

    }



    /*
      ========================================
      CHARACTER COUNT
      ========================================
    */

    function updateCharacterCount() {

      const input =
        document.getElementById(
          "questionInput"
        );

      const counter =
        document.getElementById(
          "characterCount"
        );


      counter.textContent =
        input.value.length
        + " / 300";

    }



    /*
      ========================================
      SUBMIT QUESTION
      ========================================
    */

    function submitQuestion() {

      const input =
        document.getElementById(
          "questionInput"
        );

      const question =
        input.value.trim();


      /*
        Don't submit an empty question.
      */

      if (!question) {

        input.focus();

        return;

      }


      /*
        Don't allow submissions once
        the room-wide limit is reached.
      */

      if (
        questionCount >= questionLimit
      ) {

        return;

      }


      /*
        ------------------------------------
        REAL BACKEND REQUEST GOES HERE
        ------------------------------------

        Example:

        fetch("/api/rooms/questions/", {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            type: selectedType,
            question: question
          })
        })

        .then(response => response.json())

        .then(data => {

          questionCount =
            data.question_count;

          updateQuestionCount();

          input.value = "";

          updateCharacterCount();

          showFeedback();

        });

      */


      /*
        Demo behavior.
      */

      questionCount++;

      updateQuestionCount();

      input.value = "";

      updateCharacterCount();

      showFeedback();


      /*
        Move focus back to the
        question field so the player
        can immediately ask again.
      */

      input.focus();

    }



    /*
      ========================================
      UPDATE QUESTION COUNT
      ========================================
    */

    function updateQuestionCount() {

      const count =
        document.getElementById(
          "questionCount"
        );

      const progress =
        document.getElementById(
          "progressBar"
        );

      const submit =
        document.getElementById(
          "submitButton"
        );


      count.textContent =
        questionCount
        + " / "
        + questionLimit;


      const percentage =
        (
          questionCount
          / questionLimit
        ) * 100;


      progress.style.width =
        percentage + "%";


      /*
        Disable the button when
        the room-wide limit is reached.
      */

      if (
        questionCount >= questionLimit
      ) {

        submit.disabled = true;

        submit.innerHTML =
          "Question limit reached";

      }

    }



    /*
      ========================================
      FEEDBACK
      ========================================
    */

    let feedbackTimeout;


    function showFeedback() {

      const feedback =
        document.getElementById(
          "feedback"
        );


      clearTimeout(
        feedbackTimeout
      );


      feedback.classList.add(
        "show"
      );


      feedbackTimeout =
        setTimeout(() => {

          feedback.classList.remove(
            "show"
          );

        }, 1800);

    }



    /*
      ========================================
      TIMER
      ========================================
    */

    function updateTimer() {

      const timer =
        document.getElementById(
          "timer"
        );


      const minutes =
        Math.floor(
          secondsRemaining / 60
        );


      const seconds =
        secondsRemaining % 60;


      timer.textContent =
        String(minutes)
          .padStart(2, "0")
        + ":"
        + String(seconds)
          .padStart(2, "0");


      /*
        Make the timer more noticeable
        during the final 30 seconds.
      */

      if (
        secondsRemaining <= 30
      ) {

        timer.classList.add(
          "warning"
        );

      }


      /*
        The asking stage is over.
        In the real application, this
        should transition to the
        answering stage controlled
        by the backend.
      */

      if (
        secondsRemaining <= 0
      ) {

        clearInterval(
          timerInterval
        );

        timer.textContent =
          "00:00";

        document.getElementById(
          "submitButton"
        ).disabled = true;

        return;

      }


      secondsRemaining--;

    }


    const timerInterval =
      setInterval(
        updateTimer,
        1000
      );


    /*
      ========================================
      INITIALIZE
      ========================================
    */

    updateQuestionCount();

    updateCharacterCount();

  </script>
